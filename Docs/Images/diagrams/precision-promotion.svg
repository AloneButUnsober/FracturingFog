<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI, Arial, sans-serif">
  <title>Fracturing Fog — Precision Promotion (SP → DD → QD)</title>
  <desc>Zoom-driven precision threshold chart showing when single-double (IEEE-754 double) is exhausted and Double-Double (DD) then Quad-Double (QD) take over, plus where perturbation theory rescues high-zoom Mandelbrot.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#aaa"/>
    </marker>
    <style>
      .title    { fill:#FFCC00; font-size:20px; font-weight:700; text-anchor:start; }
      .axisL    { fill:#dcdcdc; font-size:13px; font-weight:600; text-anchor:middle; }
      .tick     { fill:#bbb; font-size:11px; text-anchor:middle; }
      .ticky    { fill:#bbb; font-size:11px; text-anchor:end; }
      .grid     { stroke:#333; stroke-width:1; fill:none; }
      .axis     { stroke:#888; stroke-width:1.5; fill:none; }
      .bandSP   { fill:#2a4a72; opacity:0.6; }
      .bandDD   { fill:#4a2a72; opacity:0.6; }
      .bandQD   { fill:#722a4a; opacity:0.6; }
      .bandPert { fill:#724a2a; opacity:0.55; }
      .labelB   { fill:#fff; font-size:14px; font-weight:700; text-anchor:middle; }
      .labelS   { fill:#eee; font-size:11px; text-anchor:middle; }
      .legend   { fill:#bbb; font-size:12px; }
      .note     { fill:#FFCC00; font-size:12px; font-style:italic; text-anchor:start; }
      .divider  { stroke:#FFCC00; stroke-width:1.5; stroke-dasharray:6,4; }
      .formula  { fill:#dcdcdc; font-size:13px; font-family:"Cambria Math", "Cambria", serif; font-style:italic; }
    </style>
  </defs>

  <text x="20" y="34" class="title">Precision Promotion — Zoom vs. Backend</text>
  <text x="20" y="56" class="legend">Horizontal axis = decimal zoom magnitude (log<tspan baseline-shift="sub" font-size="9">10</tspan> of the Zoom field). Vertical axis = available significant digits.</text>

  <!-- Plot area -->
  <!-- X: 100..1100; Y: 110..560 -->
  <rect x="100" y="110" width="1000" height="450" fill="#1a1a1a" stroke="#444"/>

  <!-- Vertical gridlines (one per decade 0..16) -->
  <g class="grid">
    <line x1="100"  y1="110" x2="100"  y2="560"/>
    <line x1="162"  y1="110" x2="162"  y2="560"/>
    <line x1="225"  y1="110" x2="225"  y2="560"/>
    <line x1="287"  y1="110" x2="287"  y2="560"/>
    <line x1="350"  y1="110" x2="350"  y2="560"/>
    <line x1="412"  y1="110" x2="412"  y2="560"/>
    <line x1="475"  y1="110" x2="475"  y2="560"/>
    <line x1="537"  y1="110" x2="537"  y2="560"/>
    <line x1="600"  y1="110" x2="600"  y2="560"/>
    <line x1="662"  y1="110" x2="662"  y2="560"/>
    <line x1="725"  y1="110" x2="725"  y2="560"/>
    <line x1="787"  y1="110" x2="787"  y2="560"/>
    <line x1="850"  y1="110" x2="850"  y2="560"/>
    <line x1="912"  y1="110" x2="912"  y2="560"/>
    <line x1="975"  y1="110" x2="975"  y2="560"/>
    <line x1="1037" y1="110" x2="1037" y2="560"/>
    <line x1="1100" y1="110" x2="1100" y2="560"/>
  </g>

  <!-- Horizontal grid -->
  <g class="grid">
    <line x1="100" y1="110" x2="1100" y2="110"/>
    <line x1="100" y1="200" x2="1100" y2="200"/>
    <line x1="100" y1="290" x2="1100" y2="290"/>
    <line x1="100" y1="380" x2="1100" y2="380"/>
    <line x1="100" y1="470" x2="1100" y2="470"/>
    <line x1="100" y1="560" x2="1100" y2="560"/>
  </g>

  <!-- X-axis ticks (every 2 decades) -->
  <g>
    <text class="tick" x="100"  y="580">10⁰</text>
    <text class="tick" x="225"  y="580">10²</text>
    <text class="tick" x="350"  y="580">10⁴</text>
    <text class="tick" x="475"  y="580">10⁶</text>
    <text class="tick" x="600"  y="580">10⁸</text>
    <text class="tick" x="725"  y="580">10¹⁰</text>
    <text class="tick" x="850"  y="580">10¹²</text>
    <text class="tick" x="975"  y="580">10¹⁴</text>
    <text class="tick" x="1100" y="580">10¹⁶</text>
  </g>
  <text class="axisL" x="600" y="608">Zoom magnitude</text>

  <!-- Y-axis ticks (digits) -->
  <g>
    <text class="ticky" x="93" y="115">64</text>
    <text class="ticky" x="93" y="205">48</text>
    <text class="ticky" x="93" y="295">32</text>
    <text class="ticky" x="93" y="385">16</text>
    <text class="ticky" x="93" y="475">8</text>
    <text class="ticky" x="93" y="565">0</text>
  </g>
  <text class="axisL" x="40" y="335" transform="rotate(-90 40 335)">Significant decimal digits</text>

  <!-- Bands (left edge = floor of available digits at given precision) -->
  <!-- SP: 0..~15 decades, digits ~15.95 ≈ y=386 -->
  <rect class="bandSP"   x="100" y="386" width="850" height="174"/>
  <text class="labelB"   x="500" y="425">Single-double (IEEE-754, ~15.95 digits)</text>
  <text class="labelS"   x="500" y="445">Mandelbrot / Julia / BurningShip / Tricorn / Newton</text>
  <text class="labelS"   x="500" y="461">Used until zoom &gt; ~10¹³ where last digits become noise</text>

  <!-- DD: ~10..~30 decades, digits ~31.7 ≈ y=210 -->
  <rect class="bandDD"   x="787" y="210" width="263" height="350"/>
  <text class="labelB"   x="918" y="248">Double-Double (~31.7 digits)</text>
  <text class="labelS"   x="918" y="268">Unevaluated sum (hi + lo)</text>
  <text class="labelS"   x="918" y="284">CPU dispatch in EscapeTimeCalculator</text>

  <!-- QD: above ~30 decades, digits ~63 ≈ y=120 -->
  <rect class="bandQD"   x="975" y="120" width="125" height="440"/>
  <text class="labelB"   x="1037" y="158">Quad-Double</text>
  <text class="labelS"   x="1037" y="176">(~63 digits)</text>
  <text class="labelS"   x="1037" y="192">4-term sum</text>

  <!-- Perturbation strip overlays -->
  <rect class="bandPert" x="600" y="386" width="500" height="40"/>
  <text class="labelS"   x="850" y="411" fill="#fff" font-weight="700">Perturbation + BLA → keeps SP cores fast at extreme zoom</text>

  <!-- Threshold dividers -->
  <line class="divider" x1="787" y1="110" x2="787" y2="560"/>
  <line class="divider" x1="975" y1="110" x2="975" y2="560"/>

  <text class="note" x="612" y="103">SP → DD ≈ 10¹³</text>
  <text class="note" x="800" y="103">DD → QD ≈ 10²⁸</text>

  <!-- Formula -->
  <g>
    <text class="formula" x="100" y="660">Perturbation recurrence:  δ&#8345;&#8330;&#8321; = 2·Z&#8345;·δ&#8345; + δ&#8345;² + d    (Martin 2014)</text>
    <text class="formula" x="100" y="682">Required digits ≈ log&#8321;&#8320;(Zoom) + safety margin ≈ 4 digits.</text>
    <text class="legend"  x="100" y="704">Backend hand-off owned by Calculators/EscapeTimeCalculator.cs; perturbation engine in Models/FractalKernels/* references Pauldelbrot's BLA notes.</text>
  </g>
</svg>
