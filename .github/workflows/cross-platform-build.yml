# Cross-platform build matrix.
#
# Validates that the cross-platform assemblies (Abstractions, Engine,
# Hosting, UI.Avalonia, Rendering.Silk, Rendering.Skia, FracturingFog.App)
# compile on Linux and macOS in addition to Windows. The Windows-only
# assemblies (Rendering.D3D, FracturingFog.Win, Audio, Audio.Win, the
# legacy WinExe FracturingFogCLD) are net10.0-windows TFM by construction
# and skipped on the Linux/macOS legs.
#
# Phase X.0 carve-out status (2026-06-12):
#   * Engine, Hosting, App, Audio, Rendering.D3D, Win, Audio.Win all have
#     populated source trees. The CI matrix exercises every assembly that
#     can build on the leg.
#   * FracturingFog.Audio is temporarily net10.0-windows (NAudio WASAPI /
#     WinMM); Phase X.B introduces IAudioCaptureBackend and flips this TFM
#     to net10.0.

name: Cross-platform build

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            build_windows_only: true
          - os: ubuntu-latest
            rid: linux-x64
            build_windows_only: false
          - os: macos-latest
            rid: osx-arm64
            build_windows_only: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ── Cross-platform assemblies (every leg) ────────────────────────────
      - name: Build Abstractions
        run: dotnet build Abstractions/FracturingFog.Abstractions.csproj -c Release -r ${{ matrix.rid }} --self-contained false

      - name: Build Engine
        run: dotnet build Engine/FracturingFog.Engine.csproj -c Release -r ${{ matrix.rid }} --self-contained false

      - name: Build Rendering.Silk
        run: dotnet build Rendering.Silk/FracturingFog.Rendering.Silk.csproj -c Release -r ${{ matrix.rid }} --self-contained false

      - name: Build Rendering.Skia
        run: dotnet build Rendering.Skia/FracturingFog.Rendering.Skia.csproj -c Release -r ${{ matrix.rid }} --self-contained false

      - name: Build UI.Avalonia
        run: dotnet build UI.Avalonia/FracturingFog.UI.Avalonia.csproj -c Release -r ${{ matrix.rid }} --self-contained false

      - name: Build Hosting
        run: dotnet build Hosting/FracturingFog.Hosting.csproj -c Release -r ${{ matrix.rid }} --self-contained false

      - name: Build FracturingFog.App
        run: dotnet build FracturingFog.App/FracturingFog.App.csproj -c Release -r ${{ matrix.rid }} --self-contained false

      # ── Windows-only assemblies (Win leg only) ───────────────────────────
      - name: Build FracturingFog.Audio
        if: matrix.build_windows_only
        run: dotnet build Audio/FracturingFog.Audio.csproj -c Release -r ${{ matrix.rid }} --self-contained false

      - name: Build FracturingFog.Audio.Win
        if: matrix.build_windows_only
        run: dotnet build Audio.Win/FracturingFog.Audio.Win.csproj -c Release -r ${{ matrix.rid }} --self-contained false

      - name: Build FracturingFog.Rendering.D3D
        if: matrix.build_windows_only
        run: dotnet build Rendering.D3D/FracturingFog.Rendering.D3D.csproj -c Release -r ${{ matrix.rid }} --self-contained false

      - name: Build FracturingFog.Win
        if: matrix.build_windows_only
        run: dotnet build FracturingFog.Win/FracturingFog.Win.csproj -c Release -r ${{ matrix.rid }} --self-contained false

      # Legacy WinExe — net10.0-windows + WinForms + Vortice. Windows-only
      # by construction; tracks the same Engine / Rendering.D3D / Hosting
      # assemblies as the cross-platform App until parity is reached.
      - name: Build WinExe (legacy FracturingFogCLD)
        if: matrix.build_windows_only
        run: dotnet build FracturingFogCLD.csproj -c Release

      # ── Publish smoke (every leg) ────────────────────────────────────────
      # Avalonia + Silk.NET pull RID-specific natives (libSkiaSharp,
      # libSilk.NET.OpenGL, etc.); a successful publish proves the RID
      # matrix in the csprojs covers the platforms we ship.
      - name: Publish Rendering.Silk
        run: dotnet publish Rendering.Silk/FracturingFog.Rendering.Silk.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o publish/silk-${{ matrix.rid }}

      - name: Publish UI.Avalonia
        run: dotnet publish UI.Avalonia/FracturingFog.UI.Avalonia.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o publish/avalonia-${{ matrix.rid }}

      - name: Publish Rendering.Skia
        run: dotnet publish Rendering.Skia/FracturingFog.Rendering.Skia.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o publish/skia-${{ matrix.rid }}

      - name: Publish FracturingFog.App
        run: dotnet publish FracturingFog.App/FracturingFog.App.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o publish/app-${{ matrix.rid }}

      # ── Headless GL smoke ────────────────────────────────────────────────
      # Builds the tiny cross-platform smoke CLI and runs SmokeOneFrameOffscreen
      # by default — opens an invisible GLFW window solely to obtain a 3.3
      # core context, renders into an FBO, reads a pixel back via glReadPixels.
      # Catches broken Silk.NET natives, missing libGL, or wrong RID resolution
      # before the WinExe ever ships.
      #
      # macOS now runs the smoke because invisible GLFW windows do not need
      # an interactive session — the headless WindowServer accepts them.
      # Linux still wraps xvfb-run because GLFW links X11 at startup; a true
      # surfaceless path is parked behind the EGL adapter follow-up.
      - name: Build Silk smoke CLI
        run: dotnet build Rendering.Silk.Smoke/FracturingFog.Rendering.Silk.Smoke.csproj -c Release -r ${{ matrix.rid }} --self-contained false

      - name: Install libGL + xvfb (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa xvfb x11-utils libxrandr2 libxinerama1 libxcursor1 libxi6

      - name: Run Silk smoke (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a dotnet run --project Rendering.Silk.Smoke/FracturingFog.Rendering.Silk.Smoke.csproj -c Release -r ${{ matrix.rid }} --no-build

      - name: Run Silk smoke (Windows)
        if: matrix.os == 'windows-latest'
        run: dotnet run --project Rendering.Silk.Smoke/FracturingFog.Rendering.Silk.Smoke.csproj -c Release -r ${{ matrix.rid }} --no-build

      - name: Run Silk smoke (macOS)
        if: matrix.os == 'macos-latest'
        run: dotnet run --project Rendering.Silk.Smoke/FracturingFog.Rendering.Silk.Smoke.csproj -c Release -r ${{ matrix.rid }} --no-build
