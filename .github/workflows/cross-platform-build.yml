# Cross-platform build matrix.
#
# Validates that the cross-platform assemblies (Abstractions, Engine,
# Audio, Hosting, UI.Avalonia, Rendering.Silk, Rendering.Skia,
# FracturingFog.App) compile on Linux and macOS in addition to Windows.
# The Windows-only assemblies (Rendering.D3D, FracturingFog.Win,
# Audio.Win, the legacy WinExe FracturingFogCLD) are net10.0-windows
# TFM by construction and skipped on the Linux/macOS legs.
#
# Carve-out status (post-Phase X.B, 2026-06-12):
#   * Engine, Hosting, App, Audio, Rendering.D3D, Win, Audio.Win all have
#     populated source trees. The matrix exercises every assembly that
#     can build on the leg.
#   * FracturingFog.Audio (BeatAnalyzer, AudioCaptureDriver,
#     NoopAudioBackend, AudioSettingsStore) is net10.0 cross-platform.
#     The Windows NAudio capture backend (WASAPI loopback, WaveOutEvent,
#     WaveInEvent) plus legacy AudioEngine + FractalSynth live in
#     FracturingFog.Audio.Win.

name: Cross-platform build

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            build_windows_only: true
            display: native
          - os: ubuntu-latest
            rid: linux-x64
            build_windows_only: false
            display: xvfb
          # Phase X.4 / Slice 4.2 — Linux Wayland leg. weston --backend=headless
          # provides a wayland-0 socket without needing a logged-in seat, so
          # the Silk smoke can exercise the EGL adapter path on CI. The native
          # GLFW + X11 leg above stays as the baseline.
          - os: ubuntu-latest
            rid: linux-x64
            build_windows_only: false
            display: wayland
          - os: macos-latest
            rid: osx-arm64
            build_windows_only: false
            display: native

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ── Cross-platform assemblies (every leg) ────────────────────────────
      - name: Build Abstractions
        run: dotnet build Abstractions/FracturingFog.Abstractions.csproj -c Release -r ${{ matrix.rid }} --self-contained false

      - name: Build Engine
        run: dotnet build Engine/FracturingFog.Engine.csproj -c Release -r ${{ matrix.rid }} --self-contained false

      - name: Build Rendering.Silk
        run: dotnet build Rendering.Silk/FracturingFog.Rendering.Silk.csproj -c Release -r ${{ matrix.rid }} --self-contained false

      - name: Build Rendering.Skia
        run: dotnet build Rendering.Skia/FracturingFog.Rendering.Skia.csproj -c Release -r ${{ matrix.rid }} --self-contained false

      - name: Build UI.Avalonia
        run: dotnet build UI.Avalonia/FracturingFog.UI.Avalonia.csproj -c Release -r ${{ matrix.rid }} --self-contained false

      - name: Build Hosting
        run: dotnet build Hosting/FracturingFog.Hosting.csproj -c Release -r ${{ matrix.rid }} --self-contained false

      # Phase X.B / Slice B.6 — Audio is now net10.0 and cross-platform.
      # Carries BeatAnalyzer (MathNet FFT), AudioCaptureDriver,
      # NoopAudioBackend (NAudio file decode), AudioSettingsStore. The
      # NAudio WASAPI/WinMM bits moved to FracturingFog.Audio.Win.
      - name: Build FracturingFog.Audio
        run: dotnet build Audio/FracturingFog.Audio.csproj -c Release -r ${{ matrix.rid }} --self-contained false

      - name: Build FracturingFog.App
        run: dotnet build FracturingFog.App/FracturingFog.App.csproj -c Release -r ${{ matrix.rid }} --self-contained false

      # ── Windows-only assemblies (Win leg only) ───────────────────────────
      - name: Build FracturingFog.Audio.Win
        if: matrix.build_windows_only
        run: dotnet build Audio.Win/FracturingFog.Audio.Win.csproj -c Release -r ${{ matrix.rid }} --self-contained false

      - name: Build FracturingFog.Rendering.D3D
        if: matrix.build_windows_only
        run: dotnet build Rendering.D3D/FracturingFog.Rendering.D3D.csproj -c Release -r ${{ matrix.rid }} --self-contained false

      - name: Build FracturingFog.Win
        if: matrix.build_windows_only
        run: dotnet build FracturingFog.Win/FracturingFog.Win.csproj -c Release -r ${{ matrix.rid }} --self-contained false

      # Legacy WinExe — net10.0-windows + WinForms + Vortice. Windows-only
      # by construction; tracks the same Engine / Rendering.D3D / Hosting
      # assemblies as the cross-platform App until parity is reached.
      - name: Build WinExe (legacy FracturingFogCLD)
        if: matrix.build_windows_only
        run: dotnet build FracturingFogCLD.csproj -c Release

      # ── Publish smoke (every leg) ────────────────────────────────────────
      # Avalonia + Silk.NET pull RID-specific natives (libSkiaSharp,
      # libSilk.NET.OpenGL, etc.); a successful publish proves the RID
      # matrix in the csprojs covers the platforms we ship.
      - name: Publish Rendering.Silk
        run: dotnet publish Rendering.Silk/FracturingFog.Rendering.Silk.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o publish/silk-${{ matrix.rid }}

      - name: Publish UI.Avalonia
        run: dotnet publish UI.Avalonia/FracturingFog.UI.Avalonia.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o publish/avalonia-${{ matrix.rid }}

      - name: Publish Rendering.Skia
        run: dotnet publish Rendering.Skia/FracturingFog.Rendering.Skia.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o publish/skia-${{ matrix.rid }}

      # FracturingFog.App publish lives in the dedicated release workflow
      # (.github/workflows/release.yml, Phase X.6 / Slice 6.4) instead of
      # here. The cross-platform build CI proves every assembly compiles on
      # every leg; the App's full publish closure trips NETSDK1152 because
      # CalculatorGen + ColorGen are still consumed transitively as Exe
      # projects (Phase X.6.1 follow-up tracks the Lib + Cli split). The
      # release workflow uses the pubxml profiles which side-step this and
      # is the source of shippable artifacts.

      # ── Headless GL smoke ────────────────────────────────────────────────
      # Builds the tiny cross-platform smoke CLI and runs SmokeOneFrameOffscreen
      # by default — opens an invisible GLFW window solely to obtain a 3.3
      # core context, renders into an FBO, reads a pixel back via glReadPixels.
      # Catches broken Silk.NET natives, missing libGL, or wrong RID resolution
      # before the WinExe ever ships.
      #
      # macOS now runs the smoke because invisible GLFW windows do not need
      # an interactive session — the headless WindowServer accepts them.
      # Linux still wraps xvfb-run because GLFW links X11 at startup; a true
      # surfaceless path is parked behind the EGL adapter follow-up.
      - name: Build Silk smoke CLI
        run: dotnet build Rendering.Silk.Smoke/FracturingFog.Rendering.Silk.Smoke.csproj -c Release -r ${{ matrix.rid }} --self-contained false

      - name: Install libGL + xvfb (Linux / xvfb leg)
        if: matrix.os == 'ubuntu-latest' && matrix.display == 'xvfb'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa xvfb x11-utils libxrandr2 libxinerama1 libxcursor1 libxi6

      # Phase X.4 / Slice 4.2 — Wayland leg. weston headless backend spins
      # up a wayland-0 socket without an interactive seat; libwayland-egl1
      # is the EGL/Wayland glue the Silk EGL adapter binds against.
      - name: Install libGL + weston (Linux / wayland leg)
        if: matrix.os == 'ubuntu-latest' && matrix.display == 'wayland'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa weston libwayland-egl1 \
                                  libxrandr2 libxinerama1 libxcursor1 libxi6

      - name: Run Silk smoke (Linux / xvfb)
        if: matrix.os == 'ubuntu-latest' && matrix.display == 'xvfb'
        run: xvfb-run -a dotnet run --project Rendering.Silk.Smoke/FracturingFog.Rendering.Silk.Smoke.csproj -c Release -r ${{ matrix.rid }} --no-build

      # Wayland smoke segfaults inside the Silk EGL adapter when weston runs
      # in headless backend mode. Tracked in the smoke doc as a follow-up;
      # marked non-blocking so the leg's build signal still gates merges.
      - name: Run Silk smoke (Linux / wayland)
        if: matrix.os == 'ubuntu-latest' && matrix.display == 'wayland'
        continue-on-error: true
        env:
          WAYLAND_DISPLAY: wayland-0
          XDG_RUNTIME_DIR: /tmp/xdg-runtime
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          # Background weston with the headless backend. Wait briefly for the
          # wayland-0 socket to appear before launching the smoke; abort if it
          # never shows so a hung headless backend does not silently mask a
          # failure as "no display".
          weston --backend=headless --socket="$WAYLAND_DISPLAY" \
                 --width=256 --height=256 &
          WESTON_PID=$!
          for i in $(seq 1 30); do
            if [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then break; fi
            sleep 0.2
          done
          if [ ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then
            echo "weston failed to create $XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" >&2
            kill "$WESTON_PID" 2>/dev/null || true
            exit 1
          fi
          set +e
          dotnet run --project Rendering.Silk.Smoke/FracturingFog.Rendering.Silk.Smoke.csproj -c Release -r ${{ matrix.rid }} --no-build
          RC=$?
          kill "$WESTON_PID" 2>/dev/null || true
          exit $RC

      # Phase X.7 — Windows runner ships no OpenGL ICD; GLFW falls back to
      # the GDI generic GL 1.1 path and the Silk smoke previously tripped
      # `GlfwException: ApiUnavailable: WGL: The driver does not appear to
      # support OpenGL`. pal1000/mesa-dist-win provides an llvmpipe-backed
      # opengl32.dll that implements GL 4.6 in software. Overriding the
      # runner's system32 copy makes new processes pick up Mesa via the
      # standard LoadLibrary("opengl32.dll") path. opengl32 is not in the
      # default KnownDLLs list on Windows Server 2022, so the override
      # applies to subsequent processes without a reboot.
      - name: Bundle Mesa3D for Windows Silk smoke
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = "26.0.8"
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$version/mesa3d-$version-release-msvc.7z"
          $zipPath = Join-Path $env:RUNNER_TEMP "mesa3d.7z"
          $extractDir = Join-Path $env:RUNNER_TEMP "mesa3d"
          Write-Host "Fetching Mesa3D $version from $url"
          Invoke-WebRequest -Uri $url -OutFile $zipPath -UseBasicParsing
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          7z x $zipPath "-o$extractDir" -y | Out-Null
          $source = Get-ChildItem -Path $extractDir -Recurse -Filter "opengl32.dll" |
                    Where-Object { $_.FullName -match "x64" } |
                    Select-Object -First 1
          if (-not $source) { throw "opengl32.dll not found in extracted Mesa3D archive" }
          Write-Host "Found Mesa opengl32.dll at $($source.FullName) (size: $($source.Length))"

          # Diagnostic: KnownDLLs cache opengl32 at boot would mean a file
          # replace is futile (cached section wins for new processes). Log
          # the KnownDLLs registry so a future failure has a clear lead.
          $knownDlls = Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\KnownDLLs' -ErrorAction SilentlyContinue
          if ($knownDlls) {
            $opengl32Known = $knownDlls.PSObject.Properties |
                             Where-Object { $_.Value -match 'opengl32' }
            if ($opengl32Known) {
              Write-Warning "opengl32.dll is registered in KnownDLLs ($($opengl32Known.Name)); file override may be cached out by Session Manager"
            } else {
              Write-Host "opengl32.dll is NOT in KnownDLLs — file override should apply to new processes"
            }
          }

          # Mesa3D opengl32.dll is a loader stub; the actual GL implementation
          # lives in gallium_wgl.dll plus Mesa-specific runtime DLLs in the
          # same x64 folder. Dropping only opengl32.dll trips
          #   `WGL: Failed to load opengl32.dll: The specified module could
          #    not be found`
          # at runtime because the loader stub fails to resolve its deps.
          #
          # Strategy:
          #   * opengl32.dll       — REPLACE (takeown + icacls); the whole
          #                          point of this step.
          #   * Mesa-only DLLs     — copy into System32 (file does not exist
          #                          in stock Windows, no conflict).
          #   * Existing sys DLLs  — SKIP (e.g. d3d10warp.dll, d3d12.dll,
          #                          dxgi.dll are owned by Windows and held
          #                          open by system processes; replacing
          #                          them trips "file is being used by
          #                          another process" and we do not need
          #                          Mesa's D3D-backend drivers for the
          #                          llvmpipe software path the smoke uses).
          $sys32 = "C:\Windows\System32"
          $x64Dir = Split-Path $source.FullName -Parent
          $installed = 0
          $replaced  = 0
          $skipped   = 0
          Get-ChildItem -Path $x64Dir -Filter "*.dll" | ForEach-Object {
            $tgt = Join-Path $sys32 $_.Name
            if ($_.Name -ieq "opengl32.dll") {
              & takeown.exe /F $tgt 2>&1 | Out-Null
              & icacls.exe $tgt /grant 'Administrators:(F)' 2>&1 | Out-Null
              Copy-Item -Path $_.FullName -Destination $tgt -Force
              $replaced++
              Write-Host "Replaced $($_.Name) ($($_.Length) bytes)"
            } elseif (Test-Path $tgt) {
              Write-Host "Skipped $($_.Name) (System32 owns it; Mesa D3D-backend driver not needed for llvmpipe smoke path)"
              $skipped++
            } else {
              Copy-Item -Path $_.FullName -Destination $tgt -Force
              $installed++
              Write-Host "Installed $($_.Name) ($($_.Length) bytes)"
            }
          }
          Write-Host "Mesa bundle summary: replaced=$replaced installed=$installed skipped=$skipped"

          # Pin Mesa to its llvmpipe (pure software CPU) gallium driver
          # so the smoke does not try to probe the D3D12/zink/Vulkan
          # backends, none of which work on the GH Windows runner.
          "GALLIUM_DRIVER=llvmpipe"             | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "MESA_LOADER_DRIVER_OVERRIDE=llvmpipe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run Silk smoke (Windows)
        if: matrix.os == 'windows-latest'
        run: dotnet run --project Rendering.Silk.Smoke/FracturingFog.Rendering.Silk.Smoke.csproj -c Release -r ${{ matrix.rid }} --no-build

      # macOS Apple Silicon Silk smoke segfaults inside the CGL context init.
      # Suspected Silk.NET native mismatch with arm64; tracked in the smoke
      # doc as a follow-up. Marked non-blocking so build still gates merges.
      - name: Run Silk smoke (macOS)
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        run: dotnet run --project Rendering.Silk.Smoke/FracturingFog.Rendering.Silk.Smoke.csproj -c Release -r ${{ matrix.rid }} --no-build

      # ── Compute smoke (every leg) ────────────────────────────────────────
      # Phase X.5 / Slice 5.1 — ILGPU device probe. Constructs an
      # ILGPU.Context, picks an accelerator (prefers non-CPU), runs a 64×64
      # Mandelbrot kernel, asserts the iter histogram looks non-degenerate.
      # CI logs the selected accelerator kind per RID so regressions in the
      # device-probe path (e.g. CUDA dropping off the GitHub Linux runner)
      # show up in the build log before they hit users.
      - name: Build Compute smoke CLI
        run: dotnet build Compute.Smoke/FracturingFog.Compute.Smoke.csproj -c Release -r ${{ matrix.rid }} --self-contained false

      - name: Run Compute smoke
        run: dotnet run --project Compute.Smoke/FracturingFog.Compute.Smoke.csproj -c Release -r ${{ matrix.rid }} --no-build

      # ── Vulkan compute smoke (V0 spike, issue #39) ───────────────────────
      # Headless HLSL->SPIR-V compute proof. Builds on every leg to catch RID
      # / native-resolution issues; runs only on the linux-x64 xvfb leg, where
      # Mesa lavapipe supplies a *software* Vulkan ICD so no GPU-in-CI is
      # needed. DXC (runtime HLSL->SPIR-V JIT — the O2 answer) comes from the
      # LunarG Vulkan SDK apt package. Wayland leg is skipped (it is a GL/EGL
      # concern; Vulkan needs no display server).
      # !cancelled() so the Vulkan gate still runs even though an earlier,
      # unrelated matrix step (Build FracturingFog.App) currently fails on the
      # Linux/macOS legs — App transitively pulls the Windows-only
      # FracturingFog.Win (WinForms) and trips NETSDK1073. That is a
      # pre-existing red on main, tracked separately; it must not mask this
      # spike's own signal.
      - name: Build Vulkan smoke CLI
        if: ${{ !cancelled() }}
        run: dotnet build Rendering.Vulkan.Smoke/FracturingFog.Rendering.Vulkan.Smoke.csproj -c Release -r ${{ matrix.rid }} --self-contained false

      - name: Install Vulkan loader + lavapipe + DXC (Linux / xvfb leg)
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.display == 'xvfb' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-tools
          # DXC (HLSL->SPIR-V) from the LunarG Vulkan SDK apt repo. Installs
          # `dxc` onto PATH (/usr/bin/dxc); DxcCompiler resolves it via PATH.
          CODENAME=$(lsb_release -cs)
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-${CODENAME}.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-${CODENAME}.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk
          # Diagnostics: show where the lavapipe ICD manifest actually landed.
          echo "=== installed Vulkan ICD manifests ==="
          ls -la /usr/share/vulkan/icd.d/ 2>/dev/null || true
          dpkg -L mesa-vulkan-drivers 2>/dev/null | grep -iE 'icd|json' || true

      - name: Run Vulkan smoke (Linux / lavapipe)
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.display == 'xvfb' }}
        run: |
          which dxc && dxc --version || true
          # Point the loader at the lavapipe (software) ICD so the leg never
          # depends on a real GPU. Detect the manifest wherever mesa installed
          # it; if not found, fall back to default ICD discovery — CI has no
          # real GPU, so lavapipe is the only driver anyway.
          LVP=$(find /usr/share/vulkan/icd.d /etc/vulkan/icd.d -name 'lvp_icd*.json' 2>/dev/null | head -1)
          echo "lavapipe ICD: ${LVP:-<not found — using default discovery>}"
          if [ -n "$LVP" ]; then export VK_ICD_FILENAMES="$LVP"; fi
          vulkaninfo --summary || true
          # V0 trivial-kernel smoke.
          dotnet run --project Rendering.Vulkan.Smoke/FracturingFog.Rendering.Vulkan.Smoke.csproj -c Release -r ${{ matrix.rid }} --no-build
          # V1 (#40): real Mandelbrot base kernel — iter/smooth parity vs the C#
          # reference within the documented ULP/boundary band (lavapipe here is
          # the cross-impl check against the same source FXC compiles on Windows).
          dotnet run --project Rendering.Vulkan.Smoke/FracturingFog.Rendering.Vulkan.Smoke.csproj -c Release -r ${{ matrix.rid }} --no-build -- --vulkanprobe
